<title>Livro de Contas — gestão de dinheiro, despesas e dívidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --tinta:#141B26;
  --tinta-2:#46536A;
  --tinta-3:#79879E;
  --papel:#EDF0F4;
  --superficie:#FFFFFF;
  --linha:#D7DDE6;
  --linha-forte:#B9C3D1;
  --verde:#0F7A5A;
  --verde-fundo:#E4F2EC;
  --vermelho:#A8362A;
  --vermelho-fundo:#F7E7E4;
  --ocre:#B8860E;
  --ocre-fundo:#FBF0D8;
  --azul:#2C5AA8;
  --raio:10px;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --display:'Bricolage Grotesque', Georgia, serif;
  --corpo:'Instrument Sans', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;background:var(--papel)}
body{
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
  background:var(--papel);
  color:var(--tinta);
  font-family:var(--corpo);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{
  background:var(--tinta);color:#EDF0F4;
  padding:22px 14px;display:flex;flex-direction:column;gap:22px;
  position:sticky;top:0;height:100vh;
}
.marca{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.marca b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-0.02em;line-height:1.1}
.marca span{font-size:11px;color:#8C9AB1;letter-spacing:0.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 10px;border-radius:8px;color:#C2CBDA;font-weight:500;font-size:14px;text-align:left;
}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:#EDF0F4;color:var(--tinta);font-weight:600}
.nav i{width:16px;height:16px;display:block;flex:none}
.rail-fim{margin-top:auto;padding:0 8px;font-size:11px;color:#77839A;line-height:1.5}
#estado-guardado{display:flex;align-items:center;gap:6px}
#estado-guardado::before{content:'';width:6px;height:6px;border-radius:50%;background:#4FA783}

main{min-width:0;display:flex;flex-direction:column}
.topo{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:16px 26px;padding-top:calc(16px + env(safe-area-inset-top));
  background:var(--superficie);border-bottom:1px solid var(--linha);
  position:sticky;top:0;z-index:20;
}
.seletor-mes{display:flex;align-items:center;gap:4px}
.seletor-mes button{
  width:30px;height:30px;border:1px solid var(--linha);border-radius:7px;color:var(--tinta-2);
  display:grid;place-items:center;font-size:15px;background:var(--superficie);
}
.seletor-mes button:hover{border-color:var(--tinta);color:var(--tinta)}
.seletor-mes h2{font-family:var(--display);font-size:17px;font-weight:700;min-width:150px;text-align:center;text-transform:capitalize;letter-spacing:-0.01em}
.saldo-topo{text-align:right;line-height:1.2}
.saldo-topo small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3)}
.saldo-topo strong{font-size:20px;font-weight:600}
.conteudo{padding:22px 26px 60px;max-width:1180px;width:100%}
.view{display:none;flex-direction:column;gap:18px}
.view.on{display:flex}

/* ---------- peças ---------- */
.cartao{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);padding:18px}
.cartao > h3{
  font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--tinta-2);margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;
}
.cartao > h3 em{font-style:normal;font-weight:500;font-size:11px;color:var(--tinta-3);text-transform:none;letter-spacing:0;font-family:var(--corpo)}
.grelha{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1.35fr 1fr}
.g2i{grid-template-columns:1fr 1fr}

.kpi{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px}
.kpi small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3);display:block;margin-bottom:6px}
.kpi strong{font-size:24px;font-weight:600;display:block;line-height:1.1}
.kpi span{font-size:12px;color:var(--tinta-3);display:block;margin-top:4px}
.pos{color:var(--verde)} .neg{color:var(--vermelho)} .aviso{color:var(--ocre)}

/* régua do mês — o elemento assinatura */
.regua-topo{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:12px;color:var(--tinta-2)}
.regua{height:42px;border-radius:6px;overflow:hidden;display:flex;background:var(--papel);border:1px solid var(--linha)}
.regua div{height:100%;position:relative;transition:width .35s ease}
.regua div:hover{filter:brightness(1.12)}
.regua .sobra{background:repeating-linear-gradient(45deg,#DCE6E0,#DCE6E0 5px,#EDF3EF 5px,#EDF3EF 10px)}
.escala{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--tinta-3);border-top:1px solid var(--linha)}
.escala span{padding-top:3px;border-left:1px solid var(--linha);padding-left:4px;flex:1}
.escala span:last-child{flex:none;border-left:none}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12px}
.legenda i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
.legenda b{font-weight:600;font-family:var(--mono);font-size:12px}

/* listas */
.linhas{display:flex;flex-direction:column}
.linha{
  display:grid;grid-template-columns:58px 1fr auto auto;gap:12px;align-items:center;
  padding:11px 4px;border-bottom:1px solid var(--linha);
}
.linha:last-child{border-bottom:none}
.linha:hover{background:#F7F9FB}
.linha .dia{font-family:var(--mono);font-size:12px;color:var(--tinta-3)}
.linha .desc{min-width:0}
.linha .desc b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha .desc span{font-size:11.5px;color:var(--tinta-3)}
.linha .val{font-family:var(--mono);font-weight:600;font-size:14px;white-space:nowrap}
.acoes{display:flex;gap:2px;opacity:.35}
.linha:hover .acoes{opacity:1}
.acoes button{width:26px;height:26px;border-radius:6px;color:var(--tinta-2);display:grid;place-items:center}
.acoes button:hover{background:var(--papel);color:var(--tinta)}
.marca-cat{display:inline-flex;align-items:center;gap:5px}
.marca-cat i{width:8px;height:8px;border-radius:2px;flex:none}

/* barras de progresso */
.barra{height:8px;border-radius:4px;background:var(--papel);overflow:hidden;border:1px solid var(--linha)}
.barra div{height:100%;border-radius:4px;transition:width .4s ease}
.item-prog{padding:12px 0;border-bottom:1px solid var(--linha)}
.item-prog:last-child{border-bottom:none}
.item-prog header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.item-prog header b{font-weight:600;font-size:14px}
.item-prog header span{font-family:var(--mono);font-size:12.5px;color:var(--tinta-2);white-space:nowrap}
.item-prog footer{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:11.5px;color:var(--tinta-3)}

/* botões */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;
  background:var(--tinta);color:#fff;font-weight:600;font-size:13.5px;border:1px solid var(--tinta);
}
.btn:hover{background:#242F41}
.btn.claro{background:var(--superficie);color:var(--tinta);border-color:var(--linha-forte)}
.btn.claro:hover{background:var(--papel)}
.btn.perigo{background:var(--vermelho);border-color:var(--vermelho)}
.btn.pequeno{padding:6px 11px;font-size:12.5px;border-radius:7px}
.barra-acoes{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* formulários */
label.campo{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--tinta-2);font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--linha-forte);border-radius:8px;background:var(--superficie);
  font-size:16px;-webkit-appearance:none;appearance:none;min-height:44px;
}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tinta-2) 50%),linear-gradient(135deg,var(--tinta-2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus,textarea:focus{border-color:var(--tinta);outline:none}
.seg{display:flex;background:var(--papel);border:1px solid var(--linha-forte);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px;border-radius:6px;font-size:13px;font-weight:600;color:var(--tinta-2)}
.seg button.on{background:var(--superficie);color:var(--tinta);box-shadow:0 1px 2px rgba(20,27,38,.12)}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:6px}

/* etiquetas */
.etiq{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em}
.etiq.verde{background:var(--verde-fundo);color:var(--verde)}
.etiq.vermelha{background:var(--vermelho-fundo);color:var(--vermelho)}
.etiq.ocre{background:var(--ocre-fundo);color:var(--ocre)}
.etiq.cinza{background:var(--papel);color:var(--tinta-2)}

.vazio{text-align:center;padding:34px 18px;color:var(--tinta-3)}
.vazio b{display:block;font-family:var(--display);font-size:16px;color:var(--tinta);margin-bottom:5px;font-weight:700}
.vazio p{font-size:13.5px;margin-bottom:14px}

.tabela-mono{width:100%;border-collapse:collapse;font-size:13px}
.tabela-mono th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3);padding:0 8px 8px 0;font-weight:600}
.tabela-mono td{padding:9px 8px 9px 0;border-top:1px solid var(--linha)}
.tabela-mono td.n{font-family:var(--mono);text-align:right;padding-right:0}

/* modal */
.fundo{position:fixed;inset:0;background:rgba(20,27,38,.45);display:none;place-items:center;z-index:60;padding:16px}
.fundo.on{display:grid}
.modal{background:var(--superficie);border-radius:14px;width:min(460px,100%);max-height:90vh;overflow:auto;padding:22px}
.modal h3{font-family:var(--display);font-size:19px;font-weight:700;margin-bottom:4px}
.modal p.sub{font-size:13px;color:var(--tinta-3);margin-bottom:16px}
.modal form{display:flex;flex-direction:column;gap:13px}
.linha-dupla{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.modal footer{display:flex;gap:9px;justify-content:flex-end;margin-top:6px}
.check{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--tinta-2)}
.check input{width:16px;height:16px;accent-color:var(--tinta)}

.instalar{background:var(--tinta);color:#EDF0F4;border-radius:var(--raio);padding:16px 18px}
.instalar h3{font-family:var(--display);font-size:15px;font-weight:700;margin-bottom:6px;color:#fff}
.instalar p{font-size:13.5px;color:#C2CBDA;line-height:1.55}
.instalar kbd{background:rgba(255,255,255,.14);border-radius:5px;padding:1px 6px;font-family:var(--corpo);font-size:12.5px}
.instalar button{margin-top:12px;color:#8C9AB1;font-size:12.5px;text-decoration:underline}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--tinta);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:80;
  transition:opacity .2s,transform .2s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

svg .eixo{stroke:var(--linha);stroke-width:1}
svg text{font-family:var(--mono);font-size:10px;fill:var(--tinta-3)}
svg text.rot{font-family:var(--corpo);font-size:11px;fill:var(--tinta-2)}

@media (max-width:980px){ .g4{grid-template-columns:1fr 1fr} .g2,.g2i{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{
    position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;z-index:50;border-top:1px solid #2A3547;
  }
  .marca,.rail-fim{display:none}
  .nav{flex-direction:row;width:100%;gap:0}
  .nav button{flex-direction:column;gap:3px;padding:7px 2px;font-size:9.5px;border-radius:7px;text-align:center;letter-spacing:-.01em}
  .nav button.on{background:rgba(255,255,255,.12);color:#fff}
  .conteudo{padding:16px 14px 96px}
  .topo{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
  .seletor-mes h2{font-size:15px;min-width:118px}
  .saldo-topo strong{font-size:17px}
  .linha{grid-template-columns:46px 1fr auto;gap:9px}
  .linha .acoes{grid-column:3;opacity:1}
  .acoes button{width:36px;height:36px;font-size:15px}
  .btn{padding:11px 16px}
  .btn.pequeno{padding:9px 13px}
  .nav button{min-height:48px}
  .linha .val{grid-column:2;justify-self:end}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="marca">
      <b>Livro de Contas</b>
      <span>Finanças pessoais</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-fim">
      <div id="estado-guardado">Guardado neste dispositivo</div>
      <div style="margin-top:6px">Valores em euros (€)</div>
    </div>
  </aside>

  <main>
    <div class="topo">
      <div class="seletor-mes">
        <button id="mes-ant" aria-label="Mês anterior">‹</button>
        <h2 id="mes-titulo">—</h2>
        <button id="mes-seg" aria-label="Mês seguinte">›</button>
        <button id="mes-hoje" class="btn claro pequeno" style="margin-left:6px">Hoje</button>
      </div>
      <div class="saldo-topo">
        <small>Saldo acumulado</small>
        <strong class="num" id="saldo-global">—</strong>
      </div>
    </div>

    <div class="conteudo">
      <section class="view on" id="v-resumo"></section>
      <section class="view" id="v-movimentos"></section>
      <section class="view" id="v-orcamentos"></section>
      <section class="view" id="v-dividas"></section>
      <section class="view" id="v-objetivos"></section>
      <section class="view" id="v-definicoes"></section>
    </div>
  </main>
</div>

<div class="fundo" id="fundo"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= dados e utilitários ======================= */
const CAT_DESPESA = [
  ['Habitação','#2C5AA8'],['Alimentação','#0F7A5A'],['Transportes','#A8362A'],
  ['Saúde','#D69A2E'],['Restauração','#5B4B8A'],['Lazer','#1F7A8C'],
  ['Compras','#B5533C'],['Assinaturas','#6E7A2E'],['Seguros','#8A4B72'],
  ['Educação','#41576B'],['Impostos','#7A5C1E'],['Crédito','#334155'],
  ['Poupança','#2F6F4F'],['Outros','#6B7280']
];
const CAT_RECEITA = [
  ['Salário','#0F7A5A'],['Freelance','#2C5AA8'],['Dividendos','#D69A2E'],
  ['Rendas','#5B4B8A'],['Reembolsos','#1F7A8C'],['Outros','#6B7280']
];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const cor = n => (CAT_DESPESA.concat(CAT_RECEITA).find(c => c[0] === n) || [0,'#6B7280'])[1];
const eur = n => new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',minimumFractionDigits:2}).format(n||0);
const eurCurto = n => new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const hoje = () => new Date().toISOString().slice(0,10);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mesDe = d => (d||'').slice(0,7);
const tituloMes = m => { const [a,b] = m.split('-'); return MESES[+b-1] + ' ' + a; };
const somaMes = (m, k) => { const [a,b] = m.split('-').map(Number); const d = new Date(a, b-1+k, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };

let S = { transacoes:[], orcamentos:{}, dividas:[], objetivos:[], config:{saldoInicial:0} };
let mes = mesDe(hoje());
let vista = 'resumo';
let filtros = { tipo:'todos', categoria:'todas', texto:'', ambito:'mes' };
let estrategia = 'avalanche';

const memoria = {};
function testarArmazenamento(){
  try { localStorage.setItem('__teste__','1'); localStorage.removeItem('__teste__'); return true; }
  catch(e){ return false; }
}
const temLocal = testarArmazenamento();
const arquivo = {
  get: async k => {
    if (temLocal){ const v = localStorage.getItem(k); if (v === null) throw new Error('sem dados'); return {key:k, value:v}; }
    if (k in memoria) return {key:k, value:memoria[k]};
    throw new Error('sem dados');
  },
  set: async (k,v) => {
    if (temLocal){ localStorage.setItem(k, v); return {key:k, value:v}; }
    memoria[k] = v; return {key:k, value:v};
  }
};
const CHAVE = 'livro-contas:v1';
const comoApp = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
const eIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

let tempoGuardar = null;
function guardar(){
  clearTimeout(tempoGuardar);
  tempoGuardar = setTimeout(async () => {
    const e = document.getElementById('estado-guardado');
    try { await arquivo.set(CHAVE, JSON.stringify(S)); e.textContent = temLocal ? 'Guardado neste dispositivo' : 'Só nesta sessão'; e.style.opacity = 1; }
    catch(err){ e.textContent = 'Não foi possível guardar'; }
  }, 250);
}
async function carregar(){
  try {
    const r = await arquivo.get(CHAVE);
    if (r && r.value) S = Object.assign(S, JSON.parse(r.value));
  } catch(e) { /* primeira utilização: começa vazio */ }
}

function aviso(txt){
  const t = document.getElementById('toast');
  t.textContent = txt; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2400);
}

/* ======================= cálculos ======================= */
const doMes = m => S.transacoes.filter(t => mesDe(t.data) === m);
const total = (lista, tipo) => lista.filter(t => t.tipo === tipo).reduce((s,t) => s + Number(t.valor), 0);
const saldoGlobal = () => Number(S.config.saldoInicial||0) + total(S.transacoes,'receita') - total(S.transacoes,'despesa');

function porCategoria(m, tipo){
  const mapa = {};
  doMes(m).filter(t => t.tipo === tipo).forEach(t => { mapa[t.categoria] = (mapa[t.categoria]||0) + Number(t.valor); });
  return Object.entries(mapa).sort((a,b) => b[1]-a[1]);
}

function jurosMensais(d){ return Number(d.emDivida) * (Number(d.taxa||0)/100/12); }
function mesesParaLiquidar(d){
  const P = Number(d.emDivida), M = Number(d.prestacao||0), r = Number(d.taxa||0)/100/12;
  if (M <= 0) return null;
  if (r === 0) return Math.ceil(P/M);
  if (M <= P*r) return Infinity;
  return Math.ceil(-Math.log(1 - (r*P)/M) / Math.log(1+r));
}

/* ======================= gráficos SVG ======================= */
function graficoBarras(meses){
  const dados = meses.map(m => ({ m, r: total(doMes(m),'receita'), d: total(doMes(m),'despesa') }));
  const max = Math.max(1, ...dados.map(x => Math.max(x.r, x.d)));
  const L = 40, A = 190, alturaBar = 128, base = 150, largura = 480;
  const passo = (largura - L) / dados.length;
  let svg = `<svg viewBox="0 0 ${largura} ${A}" width="100%" role="img" aria-label="Receitas e despesas dos últimos meses">`;
  [0,0.5,1].forEach(f => {
    const y = base - alturaBar*f;
    svg += `<line class="eixo" x1="${L}" y1="${y}" x2="${largura}" y2="${y}"/><text x="0" y="${y+3}">${eurCurto(max*f)}</text>`;
  });
  dados.forEach((x,i) => {
    const cx = L + passo*i + passo/2, w = Math.min(20, passo/2.9);
    const hr = (x.r/max)*alturaBar, hd = (x.d/max)*alturaBar;
    svg += `<rect x="${cx-w-2}" y="${base-hr}" width="${w}" height="${Math.max(hr,1)}" rx="3" fill="var(--verde)"/>`;
    svg += `<rect x="${cx+2}" y="${base-hd}" width="${w}" height="${Math.max(hd,1)}" rx="3" fill="var(--vermelho)"/>`;
    svg += `<text class="rot" x="${cx}" y="${base+16}" text-anchor="middle">${MESES_CURTO[+x.m.slice(5)-1]}</text>`;
    const s = x.r - x.d;
    svg += `<text x="${cx}" y="${base+31}" text-anchor="middle" fill="${s>=0?'var(--verde)':'var(--vermelho)'}">${s>=0?'+':''}${Math.round(s)}</text>`;
  });
  return svg + '</svg>';
}

function graficoAnel(pares){
  const soma = pares.reduce((s,p) => s + p[1], 0);
  if (!soma) return '';
  const R = 62, C = 2*Math.PI*R, esp = 24;
  let off = 0;
  let svg = `<svg viewBox="0 0 170 170" width="170" height="170" role="img" aria-label="Distribuição das despesas por categoria">`;
  svg += `<g transform="translate(85,85) rotate(-90)">`;
  pares.forEach(p => {
    const frac = p[1]/soma, len = frac*C;
    svg += `<circle r="${R}" fill="none" stroke="${cor(p[0])}" stroke-width="${esp}" stroke-dasharray="${len - 1.5} ${C - len + 1.5}" stroke-dashoffset="${-off}"/>`;
    off += len;
  });
  svg += `</g><text x="85" y="80" text-anchor="middle" style="font-size:9px;letter-spacing:.08em">GASTO</text>`;
  svg += `<text x="85" y="97" text-anchor="middle" style="font-size:15px;fill:var(--tinta);font-weight:600">${eurCurto(soma)}</text></svg>`;
  return svg;
}

/* ======================= vistas ======================= */
function pintarResumo(){
  const lista = doMes(mes);
  const rec = total(lista,'receita'), des = total(lista,'despesa'), saldo = rec - des;
  const taxa = rec > 0 ? (saldo/rec)*100 : 0;
  const cats = porCategoria(mes,'despesa');
  const base = Math.max(rec, des, 1);
  const ultimas = [...lista].sort((a,b) => b.data.localeCompare(a.data)).slice(0,6);

  const alertas = [];
  Object.entries(S.orcamentos).forEach(([c,lim]) => {
    const gasto = (cats.find(x => x[0] === c)||[0,0])[1];
    if (lim > 0 && gasto > lim) alertas.push(`Orçamento de ${c} ultrapassado em ${eur(gasto-lim)}.`);
  });
  const prest = S.dividas.reduce((s,d) => s + Number(d.prestacao||0), 0);
  if (prest > 0 && rec > 0 && prest/rec > 0.35) alertas.push(`As prestações consomem ${Math.round(prest/rec*100)}% das receitas do mês.`);
  if (des > rec && rec > 0) alertas.push('Gastou mais do que recebeu este mês.');

  let regua = '';
  if (rec > 0 || des > 0){
    cats.forEach(([c,v]) => {
      regua += `<div style="width:${(v/base)*100}%;background:${cor(c)}" title="${esc(c)}: ${eur(v)}"></div>`;
    });
    if (saldo > 0) regua += `<div class="sobra" style="width:${(saldo/base)*100}%" title="Sobrou: ${eur(saldo)}"></div>`;
  }

  const legenda = cats.slice(0,8).map(([c,v]) =>
    `<span><i style="background:${cor(c)}"></i>${esc(c)} <b>${eur(v)}</b> <span style="color:var(--tinta-3)">${Math.round(v/Math.max(des,1)*100)}%</span></span>`).join('');

  const meses6 = [-5,-4,-3,-2,-1,0].map(k => somaMes(mes,k));

  document.getElementById('v-resumo').innerHTML = `
    <div class="grelha g4">
      <div class="kpi"><small>Receitas do mês</small><strong class="num pos">${eur(rec)}</strong><span>${lista.filter(t=>t.tipo==='receita').length} entradas</span></div>
      <div class="kpi"><small>Despesas do mês</small><strong class="num neg">${eur(des)}</strong><span>${lista.filter(t=>t.tipo==='despesa').length} saídas</span></div>
      <div class="kpi"><small>Sobra do mês</small><strong class="num ${saldo>=0?'pos':'neg'}">${eur(saldo)}</strong><span>${rec?`taxa de poupança ${taxa.toFixed(0)}%`:'sem receitas registadas'}</span></div>
      <div class="kpi"><small>Em dívida</small><strong class="num ${S.dividas.length?'aviso':''}">${eur(S.dividas.reduce((s,d)=>s+Number(d.emDivida),0))}</strong><span>${prest?`${eur(prest)}/mês em prestações`:'sem dívidas registadas'}</span></div>
    </div>

    ${alertas.length ? `<div class="cartao" style="border-color:var(--ocre);background:var(--ocre-fundo)">
      <h3 style="color:var(--ocre)">A merecer atenção</h3>
      <ul style="margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:5px">${alertas.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
    </div>` : ''}

    <div class="cartao">
      <h3>A régua do mês <em>onde foi parar cada euro que entrou</em></h3>
      ${(rec||des) ? `
        <div class="regua-topo"><span>Entrou ${eur(rec)}</span><span>Saiu ${eur(des)}</span></div>
        <div class="regua">${regua}</div>
        <div class="escala"><span>0</span><span>${eurCurto(base*0.25)}</span><span>${eurCurto(base*0.5)}</span><span>${eurCurto(base*0.75)}</span><span>${eurCurto(base)}</span></div>
        <div class="legenda">${legenda}${saldo>0?`<span><i class="sobra" style="background:#DCE6E0"></i>Sobrou <b>${eur(saldo)}</b></span>`:''}</div>
      ` : `<div class="vazio"><b>Ainda não há nada registado em ${tituloMes(mes)}</b><p>Registe o primeiro movimento e esta régua mostra-lhe a repartição do mês.</p><button class="btn" onclick="novaTransacao('despesa')">Registar movimento</button></div>`}
    </div>

    <div class="grelha g2">
      <div class="cartao"><h3>Seis meses <em>verde entra · vermelho sai</em></h3>${graficoBarras(meses6)}</div>
      <div class="cartao"><h3>Despesas por categoria</h3>
        ${cats.length ? `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center">
          ${graficoAnel(cats)}
          <div style="flex:1;min-width:150px">${cats.slice(0,6).map(([c,v])=>`
            <div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px;border-bottom:1px solid var(--linha)">
              <span class="marca-cat"><i style="background:${cor(c)}"></i>${esc(c)}</span><b class="num">${eur(v)}</b></div>`).join('')}
        </div></div>` : '<div class="vazio"><p>Sem despesas neste mês.</p></div>'}
      </div>
    </div>

    <div class="cartao">
      <h3>Últimos movimentos <em>${tituloMes(mes)}</em></h3>
      ${ultimas.length ? `<div class="linhas">${ultimas.map(linhaHTML).join('')}</div>
        <div style="margin-top:14px"><button class="btn claro pequeno" onclick="irPara('movimentos')">Ver todos os movimentos</button></div>`
        : '<div class="vazio"><p>Nenhum movimento neste mês.</p></div>'}
    </div>`;
}

function linhaHTML(t){
  const d = t.data.slice(8,10) + '/' + t.data.slice(5,7);
  return `<div class="linha">
    <span class="dia">${d}</span>
    <span class="desc"><b>${esc(t.descricao || t.categoria)}</b>
      <span class="marca-cat"><i style="background:${cor(t.categoria)}"></i>${esc(t.categoria)}${t.metodo?' · '+esc(t.metodo):''}${t.fixa?' · fixa':''}</span></span>
    <span class="val ${t.tipo==='receita'?'pos':'neg'}">${t.tipo==='receita'?'+':'−'} ${eur(t.valor).replace('€','').trim()} €</span>
    <span class="acoes">
      <button title="Editar" onclick="editarTransacao('${t.id}')">✎</button>
      <button title="Apagar" onclick="apagarTransacao('${t.id}')">✕</button>
    </span></div>`;
}

function pintarMovimentos(){
  let lista = filtros.ambito === 'mes' ? doMes(mes) : [...S.transacoes];
  if (filtros.tipo !== 'todos') lista = lista.filter(t => t.tipo === filtros.tipo);
  if (filtros.categoria !== 'todas') lista = lista.filter(t => t.categoria === filtros.categoria);
  if (filtros.texto) lista = lista.filter(t => (t.descricao||'').toLowerCase().includes(filtros.texto.toLowerCase()));
  lista.sort((a,b) => b.data.localeCompare(a.data));
  const rec = total(lista,'receita'), des = total(lista,'despesa');
  const cats = [...new Set(S.transacoes.map(t => t.categoria))].sort();

  document.getElementById('v-movimentos').innerHTML = `
    <div class="cartao">
      <h3>Registar <em>o essencial: quanto, em quê e quando</em></h3>
      <div class="barra-acoes">
        <button class="btn" onclick="novaTransacao('despesa')">− Nova despesa</button>
        <button class="btn claro" onclick="novaTransacao('receita')">+ Nova receita</button>
      </div>
    </div>
    <div class="cartao">
      <h3>Movimentos <em>${lista.length} registos · entrou ${eur(rec)} · saiu ${eur(des)}</em></h3>
      <div class="filtros">
        <label class="campo">Período
          <select onchange="filtros.ambito=this.value;pintar()">
            <option value="mes" ${filtros.ambito==='mes'?'selected':''}>${tituloMes(mes)}</option>
            <option value="tudo" ${filtros.ambito==='tudo'?'selected':''}>Todo o histórico</option>
          </select></label>
        <label class="campo">Tipo
          <select onchange="filtros.tipo=this.value;pintar()">
            <option value="todos">Todos</option>
            <option value="despesa" ${filtros.tipo==='despesa'?'selected':''}>Despesas</option>
            <option value="receita" ${filtros.tipo==='receita'?'selected':''}>Receitas</option>
          </select></label>
        <label class="campo">Categoria
          <select onchange="filtros.categoria=this.value;pintar()">
            <option value="todas">Todas</option>
            ${cats.map(c => `<option ${filtros.categoria===c?'selected':''}>${esc(c)}</option>`).join('')}
          </select></label>
        <label class="campo">Procurar
          <input type="text" placeholder="descrição…" value="${esc(filtros.texto)}" oninput="filtros.texto=this.value;pintar()">
        </label>
      </div>
      ${lista.length ? `<div class="linhas">${lista.map(linhaHTML).join('')}</div>`
        : `<div class="vazio"><b>Nada por aqui</b><p>Sem movimentos com estes filtros.</p><button class="btn" onclick="novaTransacao('despesa')">Registar movimento</button></div>`}
    </div>`;
}

function pintarOrcamentos(){
  const cats = porCategoria(mes,'despesa');
  const definidos = Object.entries(S.orcamentos).filter(([,v]) => v > 0);
  const totalOrc = definidos.reduce((s,[,v]) => s+v, 0);
  const gastoOrc = definidos.reduce((s,[c]) => s + (cats.find(x => x[0]===c)||[0,0])[1], 0);
  const semOrc = cats.filter(([c]) => !S.orcamentos[c]);

  document.getElementById('v-orcamentos').innerHTML = `
    <div class="grelha g4">
      <div class="kpi"><small>Orçamentado</small><strong class="num">${eur(totalOrc)}</strong><span>${definidos.length} categorias</span></div>
      <div class="kpi"><small>Já gasto</small><strong class="num ${gastoOrc>totalOrc?'neg':''}">${eur(gastoOrc)}</strong><span>${totalOrc?Math.round(gastoOrc/totalOrc*100):0}% do plano</span></div>
      <div class="kpi"><small>Ainda disponível</small><strong class="num ${totalOrc-gastoOrc<0?'neg':'pos'}">${eur(totalOrc-gastoOrc)}</strong><span>em ${tituloMes(mes)}</span></div>
      <div class="kpi"><small>Fora do orçamento</small><strong class="num">${eur(semOrc.reduce((s,x)=>s+x[1],0))}</strong><span>${semOrc.length} categorias sem limite</span></div>
    </div>

    <div class="cartao">
      <h3>Limites por categoria <em>aplicam-se a todos os meses</em></h3>
      <div class="barra-acoes" style="margin-bottom:14px"><button class="btn" onclick="definirOrcamento()">Definir limite</button></div>
      ${definidos.length ? definidos.sort((a,b)=>b[1]-a[1]).map(([c,lim]) => {
        const g = (cats.find(x => x[0]===c)||[0,0])[1];
        const p = Math.min(100, g/lim*100);
        const estado = g > lim ? 'vermelha' : (p > 80 ? 'ocre' : 'verde');
        const c1 = g > lim ? 'var(--vermelho)' : (p > 80 ? 'var(--ocre)' : cor(c));
        return `<div class="item-prog">
          <header><b class="marca-cat"><i style="background:${cor(c)}"></i>${esc(c)}</b>
            <span>${eur(g)} <span style="color:var(--tinta-3)">de ${eur(lim)}</span></span></header>
          <div class="barra"><div style="width:${p}%;background:${c1}"></div></div>
          <footer><span class="etiq ${estado}">${g>lim?`excedeu ${eur(g-lim)}`:`restam ${eur(lim-g)}`}</span>
            <span><button class="btn claro pequeno" onclick="definirOrcamento('${esc(c)}')">Alterar</button>
            <button class="btn claro pequeno" onclick="removerOrcamento('${esc(c)}')">Remover</button></span></footer>
        </div>`;
      }).join('') : `<div class="vazio"><b>Sem limites definidos</b><p>Um orçamento diz-lhe quando parar. Comece pela categoria onde gasta mais.</p><button class="btn" onclick="definirOrcamento()">Definir limite</button></div>`}
    </div>

function sobraMedia(){
  const ms = [-5,-4,-3,-2,-1,0].map(k => somaMes(mes,k));
  const vals = ms.map(m => total(doMes(m),'receita') - total(doMes(m),'despesa'));
  const ativos = ms.filter(m => doMes(m).length > 0).length || 1;
  return vals.reduce((s,v) => s+v, 0) / ativos;
}

function abrirModal({titulo, sub, corpo, botao, onSubmit}){
  const m = document.getElementById('modal');
  m.innerHTML = `<h3>${esc(titulo)}</h3>${sub?`<p class="sub">${esc(sub)}</p>`:''}

      <button type="submit" class="btn">${esc(botao)}</button></footer></form>`;
  document.getElementById('fundo').classList.add('on');
  aoSubmeter = onSubmit;
  const f = document.getElementById('form-modal');
  f.onsubmit = e => {
    e.preventDefault();
    const d = {};
    new FormData(f).forEach((v,k) => d[k] = v);
    f.querySelectorAll('input[type=checkbox]').forEach(c => d[c.name] = c.checked);
    if (aoSubmeter(d) !== false) fecharModal();
  };
  setTimeout(() => { const i = m.querySelector('input:not([type=hidden]),select'); if (i) i.focus(); }, 40);
}

/* ======================= leitura de faturas (OCR) ======================= */
const TESS_V = '5.1.1';
const FONTES_OCR = [
  { nome:'jsDelivr', base:'https://cdn.jsdelivr.net/npm' },
  { nome:'unpkg',    base:'https://unpkg.com' }
];
const dentroDeMoldura = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
let workerOCR = null;

function carregarScript(url){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('bloqueado'));
    document.head.appendChild(s);
  });
}

async function obterWorkerOCR(estado){
  if (workerOCR) return workerOCR;
  let ultimoErro = null;
  for (const fonte of FONTES_OCR){
    try {
      if (estado) estado.textContent = `A transferir o leitor (${fonte.nome})…`;
      if (!window.Tesseract){
        await carregarScript(`${fonte.base}/tesseract.js@${TESS_V}/dist/tesseract.min.js`);
      }
      if (!window.Tesseract) throw new Error('o leitor não ficou disponível');
      if (estado) estado.textContent = 'A preparar o idioma português…';
      workerOCR = await Tesseract.createWorker('por', 1, {
        workerPath: `${fonte.base}/tesseract.js@${TESS_V}/dist/worker.min.js`,
        corePath: `${fonte.base}/tesseract.js-core@${TESS_V}`
      });
      return workerOCR;
    } catch(e){
      ultimoErro = e;
      workerOCR = null;
    }
  }
  throw ultimoErro || new Error('não foi possível carregar o leitor');
}

/* reduz a imagem antes de analisar: mais rápido e mais fiável */
function prepararImagem(ficheiro){
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(ficheiro);
    img.onload = () => {
      const maxLado = 1600;
      let { width:w, height:h } = img;
      const escala = Math.min(1, maxLado / Math.max(w, h));
      w = Math.round(w * escala); h = Math.round(h * escala);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cv.toBlob(b => resolve(b || ficheiro), 'image/jpeg', 0.92);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(ficheiro); };
    img.src = url;
  });
}
function paraNumeroPT(s){
  s = s.replace(/[€\s]/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  return parseFloat(s);
}
function extrairValorFatura(texto){
  const regexValor = /\d{1,3}(?:[.\s]\d{3})*,\d{2}|\d+\.\d{2}/g;
  const candidatos = [];
  texto.split(/\n/).forEach(linha => {
    const achados = linha.match(regexValor);
    if (!achados) return;
    achados.forEach(m => {
      const v = paraNumeroPT(m);
      if (!isNaN(v) && v > 0 && v < 100000) candidatos.push({ v, linha: linha.toLowerCase() });
    });
  });
  if (!candidatos.length) return null;
  const comTotal = candidatos.filter(c => /\btotal\b/.test(c.linha) && !/subtotal/.test(c.linha));
  const base = comTotal.length ? comTotal : candidatos;
  return Math.max(...base.map(c => c.v));
}
async function lerFatura(input){
  const ficheiro = input.files[0];
  const estado = document.getElementById('ocr-estado');
  if (!ficheiro || !estado) { input.value=''; return; }
  estado.style.color = 'var(--tinta-3)';
  estado.textContent = 'A preparar…';
  try {
    const worker = await obterWorkerOCR(estado);
    estado.textContent = 'A analisar a imagem…';
    const imagem = await prepararImagem(ficheiro);
    const { data:{ text } } = await worker.recognize(imagem);
    const valor = extrairValorFatura(text);
    const campo = document.querySelector('#form-modal [name=valor]');
    if (valor && campo){
      campo.value = valor.toFixed(2);
      campo.focus(); campo.select();
      estado.style.color = 'var(--verde)';
      estado.textContent = `Valor detetado: ${eur(valor)} — confirme antes de guardar`;
    } else {
      estado.style.color = 'var(--ocre)';
      estado.textContent = 'Li a imagem mas não encontrei um total. Introduza o valor manualmente.';
    }
  } catch(e){
    console.error('Leitura da fatura:', e);
    workerOCR = null;
    estado.style.color = 'var(--vermelho)';
    estado.innerHTML = dentroDeMoldura
      ? 'Esta pré-visualização não permite transferir o leitor. Abra a aplicação pelo endereço no ecrã principal — aí funciona.'
      : 'Não consegui transferir o leitor. Verifique a ligação à internet e tente de novo; entretanto introduza o valor manualmente.';
  } finally {
    input.value = '';
  }
}

function definirOrcamento(cat){
  abrirModal({ titulo: cat ? 'Limite de ' + cat : 'Definir limite mensal',
    sub:'Vale para todos os meses até o alterar.',
    corpo: `<label class="campo">Categoria
        <select name="categoria" ${cat?'disabled':''}>${opcoesCat('despesa', cat)}</select>
        ${cat?`<input type="hidden" name="categoria" value="${esc(cat)}">`:''}</label>
      <label class="campo">Limite por mês (€)
        <input type="number" name="valor" step="1" min="0" required value="${cat?S.orcamentos[cat]||'':''}" placeholder="300"></label>`,
    botao:'Guardar limite',
    onSubmit: d => { S.orcamentos[d.categoria] = Number(d.valor); guardar(); pintar(); aviso('Limite guardado'); }});
}
function removerOrcamento(c){ delete S.orcamentos[c]; guardar(); pintar(); aviso('Limite removido'); }

function formDivida(d){
  return `<label class="campo">Nome<input type="text" name="nome" required value="${d?esc(d.nome):''}" placeholder="Crédito automóvel"></label>
    <label class="campo">Credor<input type="text" name="credor" value="${d?esc(d.credor||''):''}" placeholder="Banco, financeira, particular…"></label>
    <div class="linha-dupla">
      <label class="campo">Valor inicial (€)<input type="number" name="totalInicial" step="0.01" min="0" required value="${d?d.totalInicial:''}"></label>
      <label class="campo">Em dívida hoje (€)<input type="number" name="emDivida" step="0.01" min="0" required value="${d?d.emDivida:''}"></label>
    </div>
    <div class="linha-dupla">
      <label class="campo">Taxa de juro anual (%)<input type="number" name="taxa" step="0.01" min="0" value="${d?d.taxa:''}" placeholder="6,5"></label>
      <label class="campo">Prestação mensal (€)<input type="number" name="prestacao" step="0.01" min="0" value="${d?d.prestacao:''}" placeholder="180"></label>
    </div>
    <label class="campo">Dia de vencimento<input type="number" name="diaVencimento" min="1" max="31" value="${d?d.diaVencimento||'':''}" placeholder="8"></label>`;
}
function novaDivida(){
  abrirModal({ titulo:'Adicionar dívida', sub:'Cartões, créditos, empréstimos a familiares — tudo o que tem de devolver.',
    corpo: formDivida(null), botao:'Adicionar',
    onSubmit: d => { S.dividas.push({ id:uid(), nome:d.nome, credor:d.credor, totalInicial:Number(d.totalInicial), emDivida:Number(d.emDivida), taxa:Number(d.taxa||0), prestacao:Number(d.prestacao||0), diaVencimento:d.diaVencimento, pagamentos:[] }); guardar(); pintar(); aviso('Dívida adicionada'); }});
}
function editarDivida(id){
  const d = S.dividas.find(x => x.id === id); if (!d) return;
  abrirModal({ titulo:'Editar dívida', corpo: formDivida(d), botao:'Guardar alterações',
    onSubmit: v => { Object.assign(d, { nome:v.nome, credor:v.credor, totalInicial:Number(v.totalInicial), emDivida:Number(v.emDivida), taxa:Number(v.taxa||0), prestacao:Number(v.prestacao||0), diaVencimento:v.diaVencimento }); guardar(); pintar(); aviso('Dívida atualizada'); }});
}
function apagarDivida(id){
  const d = S.dividas.find(x => x.id === id); if (!d) return;
  if (!confirm(`Apagar a dívida "${d.nome}"?`)) return;
  S.dividas = S.dividas.filter(x => x.id !== id); guardar(); pintar(); aviso('Dívida apagada');
}
function pagarDivida(id){
  const d = S.dividas.find(x => x.id === id); if (!d) return;
  abrirModal({ titulo:'Pagamento de ' + d.nome, sub:`Em dívida agora: ${eur(d.emDivida)} · juros deste mês ${eur(jurosMensais(d))}`,
    corpo: `<label class="campo">Valor pago (€)<input type="number" name="valor" step="0.01" min="0.01" required value="${d.prestacao||''}"></label>
      <label class="campo">Data<input type="date" name="data" required value="${hoje()}"></label>
      <label class="check"><input type="checkbox" name="registar" checked> Registar também como despesa do mês</label>`,
    botao:'Registar pagamento',
    onSubmit: v => {
      const val = Number(v.valor);
      if (!(val > 0)) { aviso('Indique um valor maior que zero'); return false; }
      d.emDivida = Math.max(0, Number(d.emDivida) - val);
      (d.pagamentos = d.pagamentos || []).push({ data: v.data, valor: val });
      if (v.registar) S.transacoes.push({ id:uid(), tipo:'despesa', valor:val, data:v.data, categoria:'Crédito', descricao:'Prestação · ' + d.nome, metodo:'Débito direto', fixa:true });
      guardar(); pintar(); aviso(d.emDivida === 0 ? 'Dívida liquidada' : 'Pagamento registado');
    }});
}

function novoObjetivo(){
  abrirModal({ titulo:'Novo objetivo', sub:'Por exemplo: fundo de emergência, entrada de casa, viagem.',
    corpo: `<label class="campo">Nome<input type="text" name="nome" required placeholder="Fundo de emergência"></label>
      <div class="linha-dupla">
        <label class="campo">Quanto quer reunir (€)<input type="number" name="alvo" step="0.01" min="1" required placeholder="6000"></label>
        <label class="campo">Já tem (€)<input type="number" name="atual" step="0.01" min="0" value="0"></label>
      </div>
      <label class="campo">Prazo (opcional)<input type="date" name="prazo"></label>`,
    botao:'Criar objetivo',
    onSubmit: d => { S.objetivos.push({ id:uid(), nome:d.nome, alvo:Number(d.alvo), atual:Number(d.atual||0), prazo:d.prazo }); guardar(); pintar(); aviso('Objetivo criado'); }});
}
function depositar(id){
  const o = S.objetivos.find(x => x.id === id); if (!o) return;
  abrirModal({ titulo:'Reforçar ' + o.nome, sub:`Faltam ${eur(Math.max(0, o.alvo - o.atual))} para o objetivo.`,
    corpo: `<label class="campo">Valor a guardar (€)<input type="number" name="valor" step="0.01" min="0.01" required></label>
      <label class="campo">Data<input type="date" name="data" required value="${hoje()}"></label>
      <label class="check"><input type="checkbox" name="registar" checked> Registar como despesa na categoria Poupança</label>`,
    botao:'Guardar reforço',
    onSubmit: v => {
      const val = Number(v.valor);
      if (!(val > 0)) { aviso('Indique um valor maior que zero'); return false; }
      o.atual = Number(o.atual) + val;
      if (v.registar) S.transacoes.push({ id:uid(), tipo:'despesa', valor:val, data:v.data, categoria:'Poupança', descricao:'Poupança · ' + o.nome, metodo:'Transferência', fixa:false });
      guardar(); pintar(); aviso('Reforço registado');
    }});
}
function apagarObjetivo(id){
  const o = S.objetivos.find(x => x.id === id); if (!o) return;
  if (!confirm(`Apagar o objetivo "${o.nome}"?`)) return;
  S.objetivos = S.objetivos.filter(x => x.id !== id); guardar(); pintar(); aviso('Objetivo apagado');
}

/* ======================= dados, cópias ======================= */
function exportar(){
  const b = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'livro-de-contas-' + hoje() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  aviso('Ficheiro exportado');
}
function importar(input){
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.transacoes) throw new Error('formato');
      S = Object.assign({ transacoes:[], orcamentos:{}, dividas:[], objetivos:[], config:{saldoInicial:0} }, d);
      guardar(); pintar(); aviso('Dados importados');
    } catch(e) { aviso('Ficheiro inválido — esperava-se uma cópia exportada daqui'); }
  };
  r.readAsText(f); input.value = '';
}
function apagarTudo(){
  if (!confirm('Apagar todos os movimentos, orçamentos, dívidas e objetivos?')) return;
  S = { transacoes:[], orcamentos:{}, dividas:[], objetivos:[], config:{saldoInicial:0} };
  guardar(); pintar(); aviso('Tudo apagado');
}
function exemplo(){
  if (S.transacoes.length && !confirm('Isto substitui os dados atuais. Continuar?')) return;
  const t = [], m0 = mesDe(hoje());
  const dia = (m,d) => m + '-' + String(d).padStart(2,'0');
  [-2,-1,0].forEach(k => {
    const m = somaMes(m0,k);
    t.push({id:uid(),tipo:'receita',valor:1650,data:dia(m,1),categoria:'Salário',descricao:'Ordenado',metodo:'Transferência',fixa:true});
    if (k > -2) t.push({id:uid(),tipo:'receita',valor:180,data:dia(m,14),categoria:'Freelance',descricao:'Projeto extra',metodo:'Transferência',fixa:false});
    t.push({id:uid(),tipo:'receita',valor:42,data:dia(m,20),categoria:'Dividendos',descricao:'Dividendos trimestrais',metodo:'Transferência',fixa:false});
    t.push({id:uid(),tipo:'despesa',valor:620,data:dia(m,3),categoria:'Habitação',descricao:'Renda',metodo:'Transferência',fixa:true});
    t.push({id:uid(),tipo:'despesa',valor:88,data:dia(m,5),categoria:'Habitação',descricao:'Luz, água e internet',metodo:'Débito direto',fixa:true});
    t.push({id:uid(),tipo:'despesa',valor:absAleat(260,60),data:dia(m,8),categoria:'Alimentação',descricao:'Supermercado',metodo:'Débito',fixa:false});
    t.push({id:uid(),tipo:'despesa',valor:absAleat(95,30),data:dia(m,12),categoria:'Transportes',descricao:'Combustível e passes',metodo:'Débito',fixa:false});
    t.push({id:uid(),tipo:'despesa',valor:absAleat(70,35),data:dia(m,17),categoria:'Restauração',descricao:'Jantares fora',metodo:'MB Way',fixa:false});
    t.push({id:uid(),tipo:'despesa',valor:24,data:dia(m,18),categoria:'Assinaturas',descricao:'Streaming e nuvem',metodo:'Cartão de crédito',fixa:true});
    t.push({id:uid(),tipo:'despesa',valor:absAleat(55,25),data:dia(m,22),categoria:'Lazer',descricao:'Saídas',metodo:'MB Way',fixa:false});
    t.push({id:uid(),tipo:'despesa',valor:210,data:dia(m,8),categoria:'Crédito',descricao:'Prestação · Crédito automóvel',metodo:'Débito direto',fixa:true});
  });
  S = {
    transacoes: t,
    orcamentos: { 'Alimentação':300, 'Restauração':80, 'Transportes':120, 'Lazer':60 },
    dividas: [
      { id:uid(), nome:'Crédito automóvel', credor:'Banco', totalInicial:12000, emDivida:7400, taxa:6.5, prestacao:210, diaVencimento:8, pagamentos:[] },
      { id:uid(), nome:'Cartão de crédito', credor:'Cartão revolving', totalInicial:1800, emDivida:1250, taxa:16.9, prestacao:90, diaVencimento:25, pagamentos:[] }
    ],
    objetivos: [ { id:uid(), nome:'Fundo de emergência', alvo:6000, atual:2100, prazo:'' } ],
    config: { saldoInicial: 3200 }
  };
  mes = m0; guardar(); pintar(); aviso('Dados de exemplo carregados');
}
const absAleat = (base,var_) => Math.round(base + (Math.random()*2-1)*var_);

/* ======================= navegação ======================= */
const VISTAS = [
  ['resumo','Resumo'], ['movimentos','Movimentos'], ['orcamentos','Orçamentos'],
  ['dividas','Dívidas'], ['objetivos','Objetivos'], ['definicoes','Definições']
];
function irPara(v){ vista = v; pintar(); window.scrollTo({top:0,behavior:'smooth'}); }

function pintar(){
  document.getElementById('nav').innerHTML = VISTAS.map(([k,n]) =>
    `<button class="${vista===k?'on':''}" onclick="irPara('${k}')">${n}</button>`).join('');
  VISTAS.forEach(([k]) => document.getElementById('v'+'-'+k).classList.toggle('on', vista === k));
  document.getElementById('mes-titulo').textContent = tituloMes(mes);
  const sg = saldoGlobal();
  const el = document.getElementById('saldo-global');
  el.textContent = eur(sg); el.className = 'num ' + (sg >= 0 ? 'pos' : 'neg');
  ({ resumo:pintarResumo, movimentos:pintarMovimentos, orcamentos:pintarOrcamentos,
     dividas:pintarDividas, objetivos:pintarObjetivos, definicoes:pintarDefinicoes })[vista]();
}

function localStorageSeguro(k){ try { return localStorage.getItem('livro-contas:' + k); } catch(e){ return null; } }
function esconderInstalar(b){ try { localStorage.setItem('livro-contas:instalar-visto','1'); } catch(e){} b.closest('.instalar').remove(); }

document.getElementById('mes-ant').onclick = () => { mes = somaMes(mes,-1); pintar(); };
document.getElementById('mes-seg').onclick = () => { mes = somaMes(mes,1); pintar(); };
document.getElementById('mes-hoje').onclick = () => { mes = mesDe(hoje()); pintar(); };

(async function inicio(){
  await carregar();
  pintar();
  if (eIOS && !comoApp && !localStorageSeguro('instalar-visto')){
    document.getElementById('v-resumo').insertAdjacentHTML('afterbegin', `
      <div class="instalar">
        <h3>Pôr no ecrã principal</h3>
        <p>No Safari, toque em <kbd>Partilhar</kbd> na barra inferior, deslize até <kbd>Adicionar ao ecrã principal</kbd> e confirme.
        Fica com um ícone próprio, abre em ecrã inteiro e os registos ficam guardados no iPhone.</p>
        <button onclick="esconderInstalar(this)">Já está, esconder isto</button>
      </div>`);
  }
  if (!S.transacoes.length && !S.dividas.length){
    document.getElementById('v-resumo').insertAdjacentHTML('afterbegin', `
      <div class="cartao" style="border-color:var(--tinta)">
        <h3>Primeiro passo</h3>
        <p style="font-size:14px;color:var(--tinta-2);margin-bottom:14px">
          Registe o que entra e o que sai, e o resto — gráficos, orçamentos, prazos de dívida — preenche-se sozinho.
          Se preferir ver primeiro como fica, carregue os dados de exemplo.</p>
        <div class="barra-acoes">
          <button class="btn" onclick="novaTransacao('despesa')">Registar movimento</button>
          <button class="btn claro" onclick="exemplo()">Ver com dados de exemplo</button>
        </div>
      </div>`);
  }
})();
</script>
